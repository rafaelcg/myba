name = "sprintflow"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
# Better Auth's password hashing imports node:crypto.
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "sprintflow-db"
database_id = "71848299-73a0-4d98-a265-8653eac26a0b"

# Cloudflare Email Sending (domain mail.generate.ac onboarded in dashboard);
# used for Better Auth password-reset emails.
[[send_email]]
name = "EMAIL"

# Environment variables
[vars]
ENVIRONMENT = "production"
# Canonical public origin (custom domain on the Pages project; the
# pages.dev and www domains are additionally allowed via trustedOrigins).
BETTER_AUTH_URL = "https://generate.ac"

# Secrets (set via wrangler secret put)
# - OPENROUTER_API_KEY
# - GITLAB_CLIENT_ID
# - GITLAB_CLIENT_SECRET
# - GITLAB_TOKEN_ENCRYPTION_KEY
# - GITLAB_WEBHOOK_SECRET
# - BETTER_AUTH_SECRET
# - GOOGLE_CLIENT_ID (Google OAuth client for "Sign in with Google")
# - GOOGLE_CLIENT_SECRET
# Optional non-secret var:
# - APP_BASE_URL (frontend origin, e.g. https://app.yourdomain.com)

[build]
command = ""
